server {
    listen 80;
    server_name www.worldwide-invest.org;

    return 301 https://worldwide-invest.org$request_uri;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prefer apex if Host still arrives as www behind a proxy
    if ($host = www.worldwide-invest.org) {
        return 301 https://worldwide-invest.org$request_uri;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.(svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
